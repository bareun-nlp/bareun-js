# 타입 검사·테스트·빌드를 자동으로 돌린다.
#
# 통합 테스트(test/live.test.ts)는 BAREUN_API_KEY 가 없으면 스스로 건너뛴다.
# 서버가 없다는 이유로 빌드가 빨개지면 아무도 보지 않게 되기 때문이다.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # src/gen 은 커밋하지 않는다. proto 에서 매번 만든다.
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
